---
# =============================================================================
# Example 2: BlueGreen strategy — zero-downtime with automatic rollback
# =============================================================================
# The BlueGreen strategy creates a new process group alongside the old one,
# runs health checks, drains in-flight data from the old PG, then cuts over.
# If the new version has errors, it automatically rolls back.
#
# Best for: production flows where data loss is unacceptable.
# =============================================================================
apiVersion: nifi.crossplane.io/v1alpha1
kind: ManagedFlow
metadata:
  name: my-pipeline-safe
  namespace: crossplane-system
spec:
  forProvider:
    parentGroupId: "root"
    registryId: "10643b6f-019d-1000-f422-c1ef385ea7be"
    bucketId: "default"
    flowId: "eyal-flow"
    flowVersion: 0            # 0 = latest version
    autoUpdate: true          # automatically upgrade when new versions appear
    branch: "main"            # Git branch (for Git-based registries)
    parameterContext:
      name: "my-pipeline-safe"
      parameters:
        - name: input_topic2
          value: "events6"
#        - name: db_password
#          sensitive: true
#          valueFromSecret:
#            name: nifi-secrets
#            key: db-password
    desiredState: RUNNING
    position:
      x: 400
      "y": 0
    rollout:
      strategy: BlueGreen     # safe: health check + drain (~2-3 min)
      healthCheck:
        stabilizationWindow: "10s"  # new PG must run error-free for this long
      drainTimeout: "10s"           # max wait for old PG queues to empty
  providerConfigRef:
    name: default
    kind: ProviderConfig
