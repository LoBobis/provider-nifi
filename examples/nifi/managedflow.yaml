#---
# Auto-update example: automatically deploy new versions pushed to the registry.
# Works with both traditional NiFi Registry and Git-based registries (NiFi 2.x).
# When autoUpdate is enabled with flowVersion: 0, the controller polls for the latest
# version and triggers a blue-green rollout whenever a new version appears.
apiVersion: nifi.crossplane.io/v1alpha1
kind: ManagedFlow
metadata:
  name: eyal-pipeline3
  namespace: crossplane-system
spec:
  forProvider:
    parentGroupId: "root"
    registryId: "07af5fa3-019d-1000-6512-56bc5b546486"
    bucketId: "default"
    flowId: "eyal-flow"
    flowVersion: 0           # 0 = latest version
    autoUpdate: true          # automatically roll out new versions
    branch: "main"            # Git branch (optional, for Git-based registries)
    parameterContext:
      name: "eyal-pipeline3"
      parameters:
        - name: input_topic
          value: "events"
    desiredState: RUNNING
    position:
      "x": 400
      "y": 200
    rollout:
      strategy: BlueGreen
      healthCheck:
        stabilizationWindow: "30s"
      drainTimeout: "60s"
  providerConfigRef:
    name: default
    kind: ProviderConfig
