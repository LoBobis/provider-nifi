apiVersion: nifi.crossplane.io/v1alpha1
kind: ManagedFlow
metadata:
  name: eyal-check3
  namespace: crossplane-system
spec:
  forProvider:
    parentGroupId: "root"
    registryId: "fd48ab46-019c-1000-1c65-c982618d6728"
    bucketId: "65ae6abb-5fd7-4068-8fb1-299fd8b30627"
    flowId: "eb81939d-99db-4f35-97e7-d68e0c496345"
    flowVersion: 1
    parameterContext:
      name: "eyal-check3"
      parameters:
        - name: message
          value: "hi"
    desiredState: RUNNING
    position:
      "x": 400
      "y": 200
    rollout:
      strategy: BlueGreen
      healthCheck:
        stabilizationWindow: "30s"
      drainTimeout: "60s"
  providerConfigRef:
    name: default
    kind: ProviderConfig
