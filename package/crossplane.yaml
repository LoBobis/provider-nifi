apiVersion: meta.pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-nifi
  annotations:
    meta.crossplane.io/source: github.com/crossplane-contrib/provider-nifi
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: |
      A Crossplane provider for Apache NiFi that manages processors,
      process groups, connections, controller services, parameter contexts,
      and registry-based flow deployments.
spec:
  controller:
    permissionRequests:
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["get", "list", "watch"]
