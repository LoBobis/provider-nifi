---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: managedflows.nifi.crossplane.io
spec:
  group: nifi.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - nifi
    kind: ManagedFlow
    listKind: ManagedFlowList
    plural: managedflows
    singular: managedflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.atProvider.phase
      name: PHASE
      type: string
    - jsonPath: .status.atProvider.currentVersion
      name: VERSION
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A ManagedFlow is a managed resource that deploys a NiFi flow from a Registry
          with support for blue-green rollout on updates.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A ManagedFlowSpec defines the desired state of a ManagedFlow.
            properties:
              forProvider:
                description: ManagedFlowParameters are the configurable fields for
                  a ManagedFlow.
                properties:
                  bucketId:
                    description: BucketID is the ID of the bucket in the registry.
                    type: string
                  desiredState:
                    default: STOPPED
                    description: DesiredState is the desired run status of the imported
                      flow's processors.
                    enum:
                    - RUNNING
                    - STOPPED
                    type: string
                  flowId:
                    description: FlowID is the ID of the versioned flow in the registry.
                    type: string
                  flowVersion:
                    description: |-
                      FlowVersion is the version of the flow to import.
                      Use -1 or 0 for the latest version.
                    format: int32
                    type: integer
                  parameterContext:
                    description: |-
                      ParameterContext defines an inline parameter context to be created and managed
                      alongside the flow. Changes to parameters will trigger a rollout.
                      Mutually exclusive with parameterContextId.
                    properties:
                      description:
                        description: Description is a description of the parameter
                          context.
                        type: string
                      inheritedParameterContexts:
                        description: InheritedParameterContexts is a list of parameter
                          context IDs to inherit from.
                        items:
                          type: string
                        type: array
                      name:
                        description: Name is the display name of the parameter context
                          in NiFi.
                        type: string
                      parameters:
                        description: Parameters is the list of parameters in this
                          context.
                        items:
                          description: Parameter represents a single parameter in
                            a parameter context.
                          properties:
                            description:
                              description: Description is the parameter description.
                              type: string
                            name:
                              description: Name is the parameter name.
                              type: string
                            sensitive:
                              description: Sensitive marks the parameter as sensitive.
                              type: boolean
                            value:
                              description: Value is the parameter value.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                    required:
                    - name
                    type: object
                  parameterContextId:
                    description: |-
                      ParameterContextID is the ID of an existing parameter context to assign to the
                      process group. Mutually exclusive with parameterContext.
                    type: string
                  parentGroupId:
                    description: ParentGroupID is the ID of the parent process group
                      where the flow will be imported.
                    type: string
                  position:
                    description: Position is the position of the imported process
                      group on the canvas.
                    properties:
                      x:
                        description: X is the x coordinate.
                        type: number
                      "y":
                        description: Y is the y coordinate.
                        type: number
                    type: object
                  registryId:
                    description: RegistryID is the ID of the NiFi Registry client
                      configured in NiFi.
                    type: string
                  rollout:
                    description: Rollout configures the rollout strategy for flow
                      updates.
                    properties:
                      drainTimeout:
                        default: 60s
                        description: |-
                          DrainTimeout is how long to wait for the old PG's queues to drain
                          before forcefully deleting it. Uses Go duration format (e.g., "60s", "5m").
                        type: string
                      healthCheck:
                        description: HealthCheck configures health checking during
                          rollout.
                        properties:
                          stabilizationWindow:
                            default: 30s
                            description: |-
                              StabilizationWindow is the duration to wait with no error bulletins
                              before considering the flow healthy. Uses Go duration format (e.g., "30s", "2m").
                            type: string
                        type: object
                      strategy:
                        allOf:
                        - enum:
                          - InPlace
                          - BlueGreen
                        - enum:
                          - InPlace
                          - BlueGreen
                        default: InPlace
                        description: Strategy is the rollout strategy to use when
                          updating the flow.
                        type: string
                    type: object
                required:
                - bucketId
                - flowId
                - parentGroupId
                - registryId
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A ManagedFlowStatus represents the observed state of a ManagedFlow.
            properties:
              atProvider:
                description: ManagedFlowObservation are the observable fields of a
                  ManagedFlow.
                properties:
                  activeProcessGroupId:
                    description: ActiveProcessGroupID is the NiFi-assigned ID of the
                      currently active process group.
                    type: string
                  controllerServicesEnabled:
                    description: ControllerServicesEnabled is the number of enabled
                      controller services in the active PG.
                    format: int32
                    type: integer
                  controllerServicesTotal:
                    description: ControllerServicesTotal is the total number of controller
                      services in the active PG.
                    format: int32
                    type: integer
                  currentVersion:
                    description: CurrentVersion is the currently deployed flow version.
                    format: int32
                    type: integer
                  drainStartTime:
                    description: DrainStartTime is when queue draining began during
                      blue-green cutover.
                    format: date-time
                    type: string
                  failedFlowVersion:
                    description: FailedFlowVersion is the flow version that last failed
                      during rollout.
                    format: int32
                    type: integer
                  lastAppliedParameterHash:
                    description: |-
                      LastAppliedParameterHash is a hash of the inline parameter context config
                      that was last successfully deployed. Used to detect actual parameter changes
                      without false positives from position/desiredState changes.
                    type: string
                  lastAppliedGeneration:
                    description: |-
                      LastAppliedGeneration is the metadata.generation that was last successfully applied.
                      Used to detect spec changes (parameters, etc.) that don't change flow version.
                    format: int64
                    type: integer
                  failedGeneration:
                    description: |-
                      FailedGeneration is the metadata.generation when the last failure occurred.
                      When phase is Failed and metadata.generation == failedGeneration, the controller
                      stops retrying. Any spec change bumps the generation and triggers a new attempt.
                    format: int64
                    type: integer
                  healthCheckStartTime:
                    description: HealthCheckStartTime is when the health check began
                      during rollout.
                    format: date-time
                    type: string
                  lastRolloutTime:
                    description: LastRolloutTime is the timestamp of the last successful
                      rollout.
                    format: date-time
                    type: string
                  message:
                    description: Message is a human-readable status message.
                    type: string
                  parameterContextId:
                    description: |-
                      ParameterContextID is the NiFi-assigned ID of the managed parameter context.
                      Only set when using inline parameterContext (not parameterContextId).
                    type: string
                  previousParameterContextId:
                    description: |-
                      PreviousParameterContextID is the ID of the old parameter context pending deletion
                      after a parameter rotation. Cleared after successful cleanup.
                    type: string
                  pendingProcessGroupId:
                    description: |-
                      PendingProcessGroupID is the NiFi-assigned ID of the new process group
                      being validated during a blue-green rollout. Empty when no rollout is in progress.
                    type: string
                  previousProcessGroupId:
                    description: |-
                      PreviousProcessGroupID is the ID of an old process group that failed to delete
                      during cutover. The controller will retry cleanup on subsequent reconciles.
                    type: string
                  phase:
                    description: Phase is the current lifecycle phase of the ManagedFlow.
                    type: string
                  version:
                    description: Version is the revision version for optimistic locking.
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
