---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: connections.nifi.crossplane.io
spec:
  group: nifi.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - nifi
    kind: Connection
    listKind: ConnectionList
    plural: connections
    singular: connection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Connection is a managed resource that represents a NiFi Connection.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A ConnectionSpec defines the desired state of a NiFi Connection.
            properties:
              forProvider:
                description: ConnectionParameters are the configurable fields of a
                  NiFi Connection.
                properties:
                  backPressureDataSizeThreshold:
                    description: BackPressureDataSizeThreshold is the max data size
                      before back pressure is applied (e.g. "1 GB").
                    type: string
                  backPressureObjectThreshold:
                    description: BackPressureObjectThreshold is the max number of
                      FlowFiles before back pressure is applied.
                    format: int64
                    type: integer
                  bends:
                    description: Bends are bend points on the connection line.
                    items:
                      description: Position represents the position of a component
                        on the NiFi canvas.
                      properties:
                        x:
                          description: X is the x coordinate.
                          type: number
                        "y":
                          description: Y is the y coordinate.
                          type: number
                      type: object
                    type: array
                  destination:
                    description: Destination identifies the destination component.
                    properties:
                      groupId:
                        description: GroupID is the ID of the group that the connectable
                          belongs to.
                        type: string
                      id:
                        description: ID is the ID of the connectable component.
                        type: string
                      type:
                        description: Type is the type of the connectable component.
                        enum:
                        - PROCESSOR
                        - INPUT_PORT
                        - OUTPUT_PORT
                        - FUNNEL
                        - REMOTE_INPUT_PORT
                        - REMOTE_OUTPUT_PORT
                        type: string
                    required:
                    - groupId
                    - id
                    - type
                    type: object
                  flowFileExpiration:
                    description: FlowFileExpiration is the maximum time a FlowFile
                      can remain in the connection (e.g. "0 sec", "1 hour").
                    type: string
                  labelIndex:
                    description: LabelIndex is the index of the bend point to display
                      the label at.
                    format: int32
                    type: integer
                  loadBalanceCompression:
                    description: LoadBalanceCompression is the compression to use
                      for load balancing.
                    enum:
                    - DO_NOT_COMPRESS
                    - COMPRESS_ATTRIBUTES_ONLY
                    - COMPRESS_ATTRIBUTES_AND_CONTENT
                    type: string
                  loadBalancePartitionAttribute:
                    description: LoadBalancePartitionAttribute is the attribute to
                      partition by when using PARTITION_BY_ATTRIBUTE strategy.
                    type: string
                  loadBalanceStrategy:
                    description: LoadBalanceStrategy is the strategy for load balancing
                      FlowFiles across the cluster.
                    enum:
                    - DO_NOT_LOAD_BALANCE
                    - PARTITION_BY_ATTRIBUTE
                    - ROUND_ROBIN
                    - SINGLE_NODE
                    type: string
                  name:
                    description: Name is an optional display name for the connection.
                    type: string
                  parentGroupId:
                    description: ParentGroupID is the ID of the process group this
                      connection belongs to.
                    type: string
                  prioritizers:
                    description: Prioritizers is a list of prioritizer class names.
                    items:
                      type: string
                    type: array
                  selectedRelationships:
                    description: SelectedRelationships is the list of relationships
                      from the source to route through this connection.
                    items:
                      type: string
                    type: array
                  source:
                    description: Source identifies the source component.
                    properties:
                      groupId:
                        description: GroupID is the ID of the group that the connectable
                          belongs to.
                        type: string
                      id:
                        description: ID is the ID of the connectable component.
                        type: string
                      type:
                        description: Type is the type of the connectable component.
                        enum:
                        - PROCESSOR
                        - INPUT_PORT
                        - OUTPUT_PORT
                        - FUNNEL
                        - REMOTE_INPUT_PORT
                        - REMOTE_OUTPUT_PORT
                        type: string
                    required:
                    - groupId
                    - id
                    - type
                    type: object
                required:
                - destination
                - parentGroupId
                - source
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A ConnectionStatus represents the observed state of a NiFi
              Connection.
            properties:
              atProvider:
                description: ConnectionObservation are the observable fields of a
                  NiFi Connection.
                properties:
                  id:
                    description: ID is the NiFi-assigned ID of the connection.
                    type: string
                  version:
                    description: Version is the revision version for optimistic locking.
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
