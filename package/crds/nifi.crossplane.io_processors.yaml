kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: processors.nifi.crossplane.io
spec:
  group: nifi.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - nifi
    kind: Processor
    listKind: ProcessorList
    plural: processors
    singular: processor
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Processor is a managed resource that represents a NiFi Processor.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A ProcessorSpec defines the desired state of a NiFi Processor.
            properties:
              forProvider:
                description: ProcessorParameters are the configurable fields of a
                  NiFi Processor.
                properties:
                  config:
                    description: Config contains the processor configuration properties.
                    properties:
                      autoTerminatedRelationships:
                        description: AutoTerminatedRelationships is a list of relationships
                          to auto-terminate.
                        items:
                          type: string
                        type: array
                      bulletinLevel:
                        description: BulletinLevel is the bulletin level (DEBUG, INFO,
                          WARN, ERROR).
                        enum:
                        - DEBUG
                        - INFO
                        - WARN
                        - ERROR
                        type: string
                      comments:
                        description: Comments is a description of the processor.
                        type: string
                      concurrentlySchedulableTaskCount:
                        description: ConcurrentlySchedulableTaskCount is the number
                          of concurrent tasks.
                        format: int32
                        type: integer
                      penaltyDuration:
                        description: PenaltyDuration is the penalty duration (e.g.
                          "30 sec").
                        type: string
                      properties:
                        additionalProperties:
                          type: string
                        description: Properties is a map of processor property names
                          to values.
                        type: object
                      schedulingPeriod:
                        description: SchedulingPeriod is the scheduling period (e.g.
                          "0 sec", "1 min", "0 0 * * * ?").
                        type: string
                      schedulingStrategy:
                        description: SchedulingStrategy is the scheduling strategy
                          (TIMER_DRIVEN, CRON_DRIVEN, EVENT_DRIVEN).
                        enum:
                        - TIMER_DRIVEN
                        - CRON_DRIVEN
                        - EVENT_DRIVEN
                        type: string
                      yieldDuration:
                        description: YieldDuration is the yield duration (e.g. "1
                          sec").
                        type: string
                    type: object
                  desiredState:
                    default: STOPPED
                    description: DesiredState is the desired run status of the processor.
                    enum:
                    - RUNNING
                    - STOPPED
                    - DISABLED
                    type: string
                  name:
                    description: Name is the display name of the processor.
                    type: string
                  parentGroupId:
                    description: ParentGroupID is the ID of the process group this
                      processor belongs to.
                    type: string
                  position:
                    description: Position is the position of the processor on the
                      canvas.
                    properties:
                      x:
                        description: X is the x coordinate.
                        type: number
                      "y":
                        description: Y is the y coordinate.
                        type: number
                    type: object
                  type:
                    description: |-
                      Type is the fully qualified Java class name of the processor.
                      For example: org.apache.nifi.processors.standard.GenerateFlowFile
                    type: string
                required:
                - name
                - parentGroupId
                - type
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A ProcessorStatus represents the observed state of a NiFi
              Processor.
            properties:
              atProvider:
                description: ProcessorObservation are the observable fields of a NiFi
                  Processor.
                properties:
                  id:
                    description: ID is the NiFi-assigned ID of the processor.
                    type: string
                  runStatus:
                    description: RunStatus is the current run status of the processor.
                    type: string
                  validationErrors:
                    description: ValidationErrors lists any validation errors.
                    items:
                      type: string
                    type: array
                  validationStatus:
                    description: ValidationStatus is the validation status of the
                      processor.
                    type: string
                  version:
                    description: Version is the revision version for optimistic locking.
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
