kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: registryflows.nifi.crossplane.io
spec:
  group: nifi.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - nifi
    kind: RegistryFlow
    listKind: RegistryFlowList
    plural: registryflows
    singular: registryflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A RegistryFlow is a managed resource that represents a NiFi flow
          imported from a Registry.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A RegistryFlowSpec defines the desired state of a NiFi Registry
              Flow import.
            properties:
              forProvider:
                description: RegistryFlowParameters are the configurable fields for
                  importing a flow from a NiFi Registry.
                properties:
                  bucketId:
                    description: BucketID is the ID of the bucket in the registry.
                    type: string
                  desiredState:
                    default: STOPPED
                    description: DesiredState is the desired run status of the imported
                      flow's processors.
                    enum:
                    - RUNNING
                    - STOPPED
                    - DISABLED
                    type: string
                  flowId:
                    description: FlowID is the ID of the versioned flow in the registry.
                    type: string
                  flowVersion:
                    description: |-
                      FlowVersion is the version of the flow to import.
                      Use -1 or 0 for the latest version.
                    format: int32
                    type: integer
                  parentGroupId:
                    description: ParentGroupID is the ID of the parent process group
                      where the flow will be imported.
                    type: string
                  position:
                    description: Position is the position of the imported process
                      group on the canvas.
                    properties:
                      x:
                        description: X is the x coordinate.
                        type: number
                      "y":
                        description: Y is the y coordinate.
                        type: number
                    type: object
                  registryId:
                    description: RegistryID is the ID of the NiFi Registry client
                      configured in NiFi.
                    type: string
                required:
                - bucketId
                - flowId
                - parentGroupId
                - registryId
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A RegistryFlowStatus represents the observed state of a NiFi
              Registry Flow import.
            properties:
              atProvider:
                description: RegistryFlowObservation are the observable fields of
                  a NiFi Registry Flow.
                properties:
                  currentVersion:
                    description: CurrentVersion is the currently deployed flow version.
                    format: int32
                    type: integer
                  latestVersion:
                    description: LatestVersion is the latest available version in
                      the registry.
                    format: int32
                    type: integer
                  processGroupId:
                    description: ProcessGroupID is the NiFi-assigned ID of the created
                      process group.
                    type: string
                  stale:
                    description: Stale indicates whether the deployed version is behind
                      the latest.
                    type: boolean
                  version:
                    description: Version is the revision version for optimistic locking.
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
